name: Release

# Đẩy tag dạng v0.4.0 (trùng CFBundleShortVersionString trong FaceFinder/project.yml) -> build DMG và tạo bản phát
# hành NHÁP trên GitHub Releases. Xem lại rồi bấm Publish bằng tay.
#
# Ký Developer ID + notarize tự bật khi repo có đủ các secret sau (chưa có thì ký ad-hoc như bản dùng thử):
#   DEVELOPER_ID_P12_BASE64   chứng chỉ "Developer ID Application" xuất ra .p12, mã hoá base64
#   DEVELOPER_ID_P12_PASSWORD mật khẩu file .p12
#   DEVELOPER_ID_NAME         ví dụ: Developer ID Application: Tên (TEAMID)
#   APPLE_TEAM_ID             TEAMID
#   NOTARY_KEY_BASE64         khoá App Store Connect API (.p8), mã hoá base64
#   NOTARY_KEY_ID, NOTARY_ISSUER
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      # Chỉ bật khi có ĐỦ cả 7 secret; có một phần thì bước "Kiểm tra secret" báo lỗi thay vì lặng lẽ ký ad-hoc.
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' && secrets.DEVELOPER_ID_P12_PASSWORD != '' && secrets.DEVELOPER_ID_NAME != '' && secrets.APPLE_TEAM_ID != '' && secrets.NOTARY_KEY_BASE64 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER != '' }}
      ANY_SIGNING: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' || secrets.DEVELOPER_ID_P12_PASSWORD != '' || secrets.DEVELOPER_ID_NAME != '' || secrets.APPLE_TEAM_ID != '' || secrets.NOTARY_KEY_BASE64 != '' || secrets.NOTARY_KEY_ID != '' || secrets.NOTARY_ISSUER != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Kiểm tra secret ký
        run: |
          if [ "$ANY_SIGNING" = "true" ] && [ "$HAS_SIGNING" != "true" ]; then
            echo "::error::Mới có một phần secret ký/notarize (cần đủ 7, xem đầu release.yml)"; exit 1
          fi
          echo "Ký Developer ID + notarize: $HAS_SIGNING"

      - name: Chọn Xcode 27.0
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version

      - name: Tag trùng phiên bản app
        run: |
          VERSION=$(tools/app_version.sh)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME khác phiên bản $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Không có dữ liệu cá nhân trong repo
        run: tools/check_repo_privacy.sh

      - name: Chuẩn bị model
        uses: ./.github/actions/models

      - name: Test bộ máy
        run: swift test --package-path FaceFinderKit

      - name: Nạp chứng chỉ Developer ID
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, kiểm tra, đóng DMG
        env:
          SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID_NAME || '-' }}
          TEAM_ID: ${{ env.HAS_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}
          NOTARY_KEY_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/notary.p8', runner.temp) || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: tools/make_dmg.sh

      - name: Tạo bản phát hành nháp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist/FaceFinder-$VERSION.dmg"
          # Ghi "đã notarize" theo chính file DMG (có vé notarize được staple), không theo việc có secret hay không.
          if xcrun stapler validate "$DMG" > /dev/null 2>&1; then NOTARIZED=notarized; else NOTARIZED=; fi
          if [ "$HAS_SIGNING" = "true" ] && [ -z "$NOTARIZED" ]; then
            echo "::error::Có đủ secret nhưng DMG không có vé notarize"; exit 1
          fi
          tools/release_notes.sh "$DMG" $NOTARIZED > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" --draft \
            --title "Face Finder $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Dọn khoá ký
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
